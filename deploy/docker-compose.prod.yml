# Продакшн на VPS: наружу открыты только 80 и 443 (Caddy). База и приложение снаружи недоступны.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dashboard
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./nextjs_space
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://dashboard:${POSTGRES_PASSWORD}@db:5432/dashboard
    ports:
      # только локально на сервере: наружу приложение отдаёт nginx
      - "127.0.0.1:3000:3000"
    command: >
      sh -c "npx prisma db execute --file prisma/sql/001_multitenant.sql --schema prisma/schema.prisma && npm run start"

  proxy:
    # не используется, пока на сервере порты 80/443 заняты nginx (запуск: --profile caddy)
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
